[project]
name = "jpreplace"
version = "0.1.0"
description = "Screen overlay that replaces Japanese text with English using local AI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6-Essentials>=6.8",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "onnxruntime-gpu[cuda,cudnn]>=1.32",
    "mss>=10.0",
    "httpx>=0.28",
    "huggingface-hub>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
jpreplace = "jpreplace.__main__:main"
jpreplace-setup = "jpreplace.assets:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jpreplace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
